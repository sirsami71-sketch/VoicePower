name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unzip project
        run: |
          unzip -q VoicePower-final.zip
          ls -la VoicePower
      - name: Add service account
        env:
          SA_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          mkdir -p VoicePower/app/src/main/assets
          if [ -f sa.json ]; then
            cp sa.json VoicePower/app/src/main/assets/sa.json
          elif [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > VoicePower/app/src/main/assets/sa.json
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: VoicePower
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoicePower-apk
          path: VoicePower/app/build/outputs/apk/debug/app-debug.apk
